name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run --locked --no-sync ruff check .

      - name: Format check
        run: uv run --locked --no-sync ruff format --check .

      - name: Type check
        run: uv run --locked --no-sync ty check

      - name: Test
        run: uv run --locked --no-sync pytest

      - name: Audit dependencies
        # ChromaDB server advisories do not apply to our local PersistentClient.
        # These exceptions expire when fixes become available. See SECURITY.md.
        run: >-
          uv audit --locked
          --ignore-until-fixed GHSA-36p7-vc44-83pf
          --ignore-until-fixed GHSA-xph7-9rjv-w5fr
          --ignore-until-fixed GHSA-2wm9-hf6c-p5cr
